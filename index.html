<script>
const text = "Typing is an essential skill in today's digital world, where communication and productivity depend heavily on how fast and accurately a person can type. Improving typing speed not only saves time but also enhances focus and efficiency in daily tasks such as writing emails, creating documents, and coding. Consistent practice is the key to mastering typing, as it helps build muscle memory and reduces errors over time. Many people underestimate the importance of accuracy, but it plays a crucial role in effective communication. A good typist maintains a balance between speed and precision. By using tools like TYPEME, users can track their progress, challenge themselves, and gradually improve their performance. Remember, patience and regular practice are the most important factors in becoming a skilled typist. Stay consistent, stay focused, and you will see significant improvement in your typing abilities.";

let time = 60;
let timerStarted = false;

const textDisplay = document.getElementById("textDisplay");
const input = document.getElementById("input");

function renderText() {
    textDisplay.innerHTML = text.split("").map(char => `<span>${char}</span>`).join("");
}
renderText();

input.addEventListener("input", () => {
    if (!timerStarted) {
        startTimer();
        timerStarted = true;
    }

    const inputText = input.value.split("");
    const spanChars = textDisplay.querySelectorAll("span");

    let correct = 0;

    spanChars.forEach((charSpan, index) => {
        const typedChar = inputText[index];

        if (typedChar == null) {
            charSpan.classList.remove("correct", "wrong");
        } 
        else if (typedChar === charSpan.innerText) {
            charSpan.classList.add("correct");
            charSpan.classList.remove("wrong");
            correct++;
        } 
        else {
            charSpan.classList.add("wrong");
            charSpan.classList.remove("correct");
        }
    });

    let accuracy = (correct / inputText.length) * 100;
    document.getElementById("accuracy").innerText = accuracy ? accuracy.toFixed(0) : 0;
});

function startTimer() {
    const interval = setInterval(() => {
        time--;
        document.getElementById("time").innerText = time;

        if (time <= 0) {
            clearInterval(interval);
            calculateResult();
        }
    }, 1000);
}

function calculateResult() {
    let words = input.value.trim().split(" ").length;
    document.getElementById("wpm").innerText = words;
}
</script>
